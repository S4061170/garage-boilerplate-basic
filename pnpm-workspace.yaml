packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # Pin the audited security fixes for the affected dependency paths.
  postcss: '^8.5.18'
  sharp: '0.35.5'
  'nanoid@>=3 <4': '3.3.18'
  'js-yaml@>=4 <5': '4.3.2'
  'brace-expansion@>=1 <2': '1.1.21'
  'brace-expansion@>=2 <3': '2.1.7'
  'brace-expansion@>=5 <6': '5.0.12'
  source-map-js: '1.2.2'
  proxy-addr: '2.0.8'
  '@fastify/busboy': '3.2.2'
  # Preserve Firebase 11.10.0; patch only its Node transport dependency.
  '@firebase/firestore@4.8.0>@grpc/grpc-js': '1.13.6'
  '@grpc/grpc-js@>=1.14.0 <1.14.5': '1.14.5'
  # Tinypool 2 supports CI Node 22 and the worker APIs used by Vitest 3.2.7.
  'vitest@3.2.7>tinypool': '2.1.2'

# pnpm 10.18.3 supports this explicit build-script allowlist.
onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - lefthook
  - protobufjs
  - sharp
  - unrs-resolver
